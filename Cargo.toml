[package]
name = "starr-rust"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"

[dependencies]
async-trait = "0.1.92"
base64 = "0.23.1"
chrono = { version = "0.4.45", features = ["serde"] }
form_urlencoded = "1.2.2"
http = "1.5.0"
reqwest = { version = "0.13.4", default-features = false, features = ["json", "rustls", "cookies", "stream", "gzip", "charset", "http2", "multipart", "query"] }
reqwest_cookie_store = "0.10.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["rt", "net", "io-util", "macros", "time", "sync"] }
url = "2.5.8"

[dev-dependencies]
tokio = { version = "1.53.1", features = ["full"] }
